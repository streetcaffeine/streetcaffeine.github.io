<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Street Caffeine</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Monoton&family=Permanent+Marker&family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#14110f;--acc:#ffb300;--fg:#f5efe6;--mut:#b8a99a;--on:#1a1200;--card:color-mix(in srgb,var(--bg) 90%,var(--fg));--line:color-mix(in srgb,var(--bg) 82%,var(--fg));--wa:#25d366;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:"Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
.w{max-width:960px;margin:0 auto;padding:0 14px}
.hero{color:#fff;text-align:center;padding:54px 16px 38px;background:radial-gradient(120% 110% at 50% 0,color-mix(in srgb,var(--acc) 55%,#000),var(--bg));background-size:cover;background-position:center;border-radius:0 0 28px 28px}
.logo{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--acc);margin-bottom:10px;box-shadow:0 8px 28px #0009;background:#000}
h1{font-family:Impact,"Arial Narrow Bold",sans-serif;font-size:clamp(40px,12vw,72px);line-height:1;margin:0;text-transform:uppercase;letter-spacing:.03em;text-shadow:0 3px 18px #0008}
.tag{margin:8px 0 14px;font-size:17px;opacity:.92}.bd{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.pill{display:inline-block;padding:6px 14px;border-radius:99px;font-size:13.5px;font-weight:700}.gl{background:#ffffff26;color:#fff;backdrop-filter:blur(6px)}
.open{background:#1c8c4a;color:#fff}.closed{background:#b3362f;color:#fff}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.wab{background:var(--wa);color:#04210f}
.banner{background:var(--acc);color:var(--on);padding:11px 16px;text-align:center;font-weight:800;margin-top:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;position:sticky;top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);z-index:5;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 16px;border-radius:99px;font-size:14px;font-weight:600;text-decoration:none}
h2{font-size:22px;font-weight:800;margin:30px 0 12px;display:flex;align-items:center;gap:10px}h2:before{content:"";width:5px;height:22px;background:var(--acc);border-radius:3px}
h3{margin:0 0 4px;font-size:18px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.item{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 4px 14px #0003}
.em{position:relative;aspect-ratio:4/3;display:grid;place-items:center;font-size:52px;background:color-mix(in srgb,var(--acc) 16%,var(--card));overflow:hidden}.em img{width:100%;height:100%;object-fit:cover}
.inf{padding:10px 12px 0;flex:1;min-width:0}.inf b{display:block;font-size:15px}.inf small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.ft{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:10px 12px 12px}.pr{color:var(--acc);font-weight:800;font-size:16px}.so{color:#ff8f8f;font-size:12px;font-weight:700}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:99px;padding:9px 16px;background:var(--acc);color:var(--on);font-weight:800;text-decoration:none;display:inline-block}
button.g{background:color-mix(in srgb,var(--bg) 80%,var(--fg));color:var(--fg)}button.wa{background:var(--wa);color:#04210f;width:100%;padding:14px;font-size:16px;border-radius:14px}button.rm{background:#4a2020;color:#ffb3b3}
.qty{display:flex;align-items:center;gap:8px}.qty button{padding:3px 11px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:16px;padding:14px;margin-bottom:12px}.card p{margin:0;color:var(--mut);white-space:pre-wrap}
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;max-width:600px;margin:0 auto}.cartbar button{width:100%;padding:15px;font-size:16px;box-shadow:0 8px 28px #000a}
.ov{position:fixed;inset:0;background:#000b;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);color:var(--fg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.row{flex-wrap:wrap;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
input,select,textarea{width:100%;font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:4px 0}
label{font-size:13px;color:var(--mut)}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}.tabs button{background:var(--card);color:var(--fg)}.tabs button.on{background:var(--acc);color:var(--on)}
.adm{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:25}
footer{text-align:center;color:var(--mut);padding:34px 16px 110px;font-size:14px;line-height:1.8}footer a{color:var(--acc);font-weight:700}footer .logo{width:56px;height:56px}
.ed{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.bdg{position:absolute;top:8px;left:8px;background:var(--acc);color:var(--on);font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;font-family:system-ui,sans-serif}.bdg.nw{background:#2aa6ff;color:#fff}
.warn{background:#4a1f1f;border:1px solid #b3362f;color:#ffd0cc;padding:10px 12px;border-radius:12px;font-weight:700;margin:10px 0;font-size:14px}
.soc{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 20px}
.sb{display:inline-flex;align-items:center;gap:8px;padding:14px 22px;border-radius:16px;font-size:17px;font-weight:800;color:#fff;text-decoration:none;box-shadow:0 4px 14px #0006;transition:transform .15s,box-shadow .15s,filter .15s}
.sb:hover,.sb:focus-visible{transform:translateY(-4px) scale(1.05);box-shadow:0 12px 28px #000a;filter:brightness(1.15)}
.sb:active{transform:scale(.97)}
.sb.ig{background:linear-gradient(45deg,#f09433,#dc2743 55%,#bc1888)}.sb.tt{background:#000;border:2px solid #fff3}.sb.wc2{background:#fff;color:#1a1200}.sb.dr{background:#1a9b4b}.sb.rt{background:#ffc107;color:#1a1200}
.btn,button.wa{transition:transform .15s,filter .15s}.btn:hover,button.wa:hover{transform:translateY(-2px);filter:brightness(1.1)}
button:disabled{opacity:.45;cursor:not-allowed}button:disabled:hover{transform:none;filter:none}
.pause{background:#b3362f;color:#fff;padding:14px 16px;text-align:center;font-weight:800;font-size:16px;line-height:1.5}
.pause .btn{margin-top:10px;background:var(--wa);color:#04210f;padding:14px 26px;font-size:17px;border-radius:14px}
.tg{width:100%;padding:16px;font-size:17px;border-radius:14px;margin:8px 0 4px;color:#fff;line-height:1.3}.tg.on{background:#1c8c4a}.tg.off{background:#b3362f}.tg small{display:block;font-weight:600;opacity:.9;font-size:13px}
.wc{background:#fff!important;color:#1a1200!important}
.gov{position:fixed;inset:0;background:#000;z-index:40;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
#gv{width:100%;text-align:center;padding:0 54px}
.gimg{max-width:100%;max-height:76vh;object-fit:contain;border-radius:12px;animation:gf .35s}
@keyframes gf{from{opacity:0}to{opacity:1}}
.gcap{color:#fff;font-weight:700;font-size:17px;margin-top:12px;min-height:22px}.gct{color:#aaa;font-size:13px;margin-top:4px}
.gx{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:2;padding:12px 20px;font-size:18px;background:#fff;color:#000}
.gn{position:absolute;top:50%;left:6px;transform:translateY(-50%);width:44px;height:64px;border-radius:12px;padding:0;font-size:30px;background:#ffffff40;color:#fff;z-index:2}.gn.gr{left:auto;right:6px}
.gal{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}.gth{flex:none;width:160px;height:115px;object-fit:cover;border-radius:14px;cursor:pointer;transition:transform .15s,filter .15s}.gth:hover{transform:scale(1.05);filter:brightness(1.1)}
.bigwa{font-size:18px!important;padding:18px!important}
@keyframes scaleUp{

  0%,
  100% { transform: translateY(0) scale(1); }

  50% { transform: translateY(-5px) scale(1.05);}

}
@keyframes moveUp{

  0%,
  100% { transform: translateY(0); }
  20%  { transform: translateY(-3px); }
  50%  { transform: translateY(-8px); }

}
@keyframes lazy-scaleUp{

  0%,
  100% { transform: scale(1); }
  50%  { transform: scale(1.2); }

}
.fh{--red-orange-crayola: hsl(0, 100%, 66%); --space-cadet: hsl(249, 37%, 19%); --pistachio: hsl(88, 50%, 60%); --cultured: hsl(220, 13%, 95%); --saffron: hsl(45, 91%, 58%); --rhythm: hsl(240, 9%, 51%); --white: hsl(0, 0%, 100%); --fs-1: 46px; --fs-2: 28px; --fs-3: 18px; --fs-4: 15px; --fs-5: 14px; --px: 30px; --py: 60px; --default-transition: 0.75s ease;}
.fh *,.fh *::before,.fh *::after{margin: 0; padding: 0; box-sizing: border-box; outline-offset: 5px;}
.fh li{list-style: none;}
.fh a{font: inherit; text-decoration: none;}
.fh button{font: inherit; border: none; background: none; cursor: pointer;}
.fh img,.fh svg,.fh ion-icon,.fh span,.fh button{display: block;}
.fh{font-family: "Rubik", sans-serif; scroll-behavior: smooth;}
.fh ::-webkit-scrollbar{width: 5px;}
.fh ::-webkit-scrollbar-track{background: var(--cultured);}
.fh ::-webkit-scrollbar-thumb{border-radius: 5px; background: var(--saffron);}
.fh ::-webkit-scrollbar-thumb:hover{background: var(--space-cadet);}
.fh .btn{height: 55px; padding: 0 25px; color: var(--space-cadet); font-size: 14px; font-weight: 500; transition: var(--default-transition);}
.fh .btn:hover{filter: saturate(1.05) brightness(1.05);}
.fh .btn-primary{background: var(--saffron);}
.fh .btn-secondary{background: var(--cultured);}
.fh .btn-icon{display: flex; align-items: center; gap: 10px;}
.fh .section-title{max-width: 420px; color: var(--space-cadet); font-size: var(--fs-2); font-weight: 600;}
.fh .section-text{max-width: 320px; color: var(--rhythm); font-size: var(--fs-4); line-height: 1.4; letter-spacing: 0.5px;}
.fh .container{position: relative; max-width: 1440px; margin: auto; background: var(--white); overflow: hidden;}
.fh .navbar{position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100%; padding: 20px 30px; background: hsla(0, 0%, 100%, 0.99); border-bottom: 1px solid hsla(0, 0%, 0%, 0.05); box-shadow: 0 0 10px hsla(0, 0%, 0%, 0.05); z-index: 5;}
.fh .navbar-wrapper{display: flex; justify-content: space-between; align-items: center;}
.fh .navbar-nav{background: hsla(0, 0%, 100%, 0.9); position: absolute; top: 91px; left: 0; width: 100%; height: calc(100vh - 91px); display: flex; flex-direction: column; align-items: center; gap: 30px; padding: 35px; backdrop-filter: blur(10px); transform: translateY(50px); opacity: 0; visibility: hidden; pointer-events: none; transition: 0.3s ease-in-out;}
.fh .navbar-nav.active{transform: translateY(0); opacity: 1; visibility: visible; pointer-events: all;}
.fh .nav-link{color: var(--space-cadet); font-size: var(--fs-5); transition: 0.25s ease;}
.fh .nav-link:hover{color: var(--saffron);}
.fh .navbar-btn-group{display: flex; align-items: center; gap: 25px;}
.fh .shopping-cart-btn{position: relative; background: var(--cultured); width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 2px solid var(--white);}
.fh .shopping-cart-btn .count{background: var(--saffron); position: absolute; top: -2px; right: -2px; height: 20px; min-width: 20px; display: flex; align-items: center; padding: 0 7px; border-radius: 20px; color: var(--space-cadet); font-size: 12px; font-weight: 500;}
.fh .menu-toggle-btn{display: flex; flex-direction: column; width: 20px; gap: 5px;}
.fh .menu-toggle-btn .line{background: var(--space-cadet); width: 20px; height: 2px; border-radius: 2px; transition: 0.25s ease;}
.fh .menu-toggle-btn.active .one{transform: translateY(7px) rotate(-45deg);}
.fh .menu-toggle-btn.active .two{transform: rotate(45deg);}
.fh .menu-toggle-btn.active .three{transform: translateY(-7px) rotate(-45deg);}
.fh .cart-box{position: fixed; bottom: 0; right: 0; max-width: 400px; width: 100%; height: calc(100vh - 91px); background: hsla(0, 0%, 100%, 0.9); box-shadow: -1px 1px 3px 0 hsla(0, 0%, 0%, 0.05); backdrop-filter: blur(10px); transform: translateX(100%); visibility: hidden; z-index: 10; transition: 0.5s ease-in-out;}
.fh .cart-box.active{transform: translateX(0); visibility: visible;}
.fh .cart-box-ul{height: 100%; padding: 30px; padding-bottom: 120px; overflow-y: auto;}
.fh .cart-box-ul::-webkit-scrollbar{display: none;}
.fh .cart-h4{color: var(--space-cadet); margin-bottom: 30px; font-weight: 600;}
.fh .cart-item{background: var(--cultured); display: flex; align-items: center; margin-bottom: 30px;}
.fh .cart-item .img-box{width: 60px; height: 60px; margin-right: 15px; overflow: hidden;}
.fh .cart-item .product-img{width: 100%; height: 100%; object-fit: cover; transition: var(--default-transition);}
.fh .cart-item:hover .product-img{transform: scale(1.05);}
.fh .cart-item .product-name{color: var(--space-cadet); font-size: var(--fs-5); font-weight: 600; width: calc(100% - 135px);}
.fh .cart-item .product-price{background: var(--saffron); color: var(--space-cadet); font-weight: 500; width: 60px; height: 60px; display: flex; justify-content: center; align-items: center;}
.fh .cart-item .product-price .small{display: inline-block; font-size: 10px; font-weight: 400; margin-top: 5px;}
.fh .cart-btn-group{background: var(--white); position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 30px; border-top: 1px solid hsla(0, 0%, 0%, 0.1); z-index: 15;}
.fh .home{display: grid; grid-template-columns: 1fr; gap: 50px; padding: 150px var(--px) var(--py);}
.fh .home-left{text-align: center;}
.fh .home-subtext{background: var(--cultured); color: var(--space-cadet); font-size: 13px; display: inline-block; padding: 3px; margin-bottom: 30px;}
.fh .main-heading{color: var(--space-cadet); font-size: var(--fs-1); font-weight: 600; line-height: 1.1; letter-spacing: -2px; margin-bottom: 30px;}
.fh .home-text{color: var(--rhythm); margin-bottom: 30px; line-height: 1.6;}
.fh .home .btn-group{display: flex; flex-direction: column; align-items: center; gap: 15px;}
.fh .home-right{position: relative; aspect-ratio: 10 / 11; padding-top: 110%;}
.fh .food-img{position: absolute; width: 60%;}
.fh .food-1{top: 25%; left: -4%; animation: scaleUp 3s ease-in-out infinite;}
.fh .food-2{top: 0; right: -4%; animation: scaleUp 2s ease-in-out infinite;}
.fh .food-3{bottom: -4%; right: -4%; animation: scaleUp 4s ease-in-out infinite;}
.fh .dialog{position: absolute; filter: drop-shadow(0px 2px 46px hsla(0, 0%, 0%, 0.4));}
.fh .dialog-1{top: 10%; right: 15%;}
.fh .dialog-2{bottom: 20%; right: 5%;}
.fh .shape{position: absolute; filter: drop-shadow(0px 3px 6px hsla(0, 0%, 0%, 0.1));}
.fh .shape-1{top: 0; left: 5%; animation: scaleUp 2s 3s ease-in-out infinite;}
.fh .shape-2{right: 0; top: 55%; animation: scaleUp 3s 4s ease-in-out infinite;}
.fh .shape-3{bottom: 5%; left: 5%; animation: scaleUp 3s 1s ease-in-out infinite;}
.fh .shape-4{top: 35%; right: 0; animation: moveUp 3s 1s ease-in-out infinite;}
.fh .shape-5{top: 60%; left: 0; animation: moveUp 3s ease-in-out infinite;}
.fh .about{padding: var(--py) var(--px); display: grid; grid-template-columns: 1fr; gap: 60px;}
.fh .about-left{position: relative;}
.fh .about-left .img-box{aspect-ratio: 1 / 1; overflow: hidden;}
.fh .about-img{width: 100%; height: 100%; object-fit: cover; animation: lazy-scaleUp 30s linear infinite;}
.fh .abs-content-box{background: var(--white); position: absolute; bottom: -20px; right: -20px; padding: 30px; text-align: center; box-shadow: 2px 2px 10px hsla(0, 0%, 0%, 0.1);}
.fh .dotted-border{border: 3px dotted var(--cultured); padding: 10px;}
.fh .number-lg{font-size: var(--fs-1); font-family: "Monoton", cursive; color: var(--space-cadet);}
.fh .text-md{font-size: var(--fs-3); font-weight: 600; color: var(--space-cadet);}
.fh .shape-6{right: -9px; top: 35%; animation: scaleUp 2s 3s ease-in-out infinite;}
.fh .shape-7{top: 50%; left: -15px; animation: scaleUp 3s ease-in-out infinite;}
.fh .shape-8{top: -10px; left: 15%; animation: moveUp 3s 1s ease-in-out infinite;}
.fh .shape-9{bottom: -20px; left: 5%; animation: moveUp 3s ease-in-out infinite;}
.fh .about-right .section-title{margin-bottom: 30px;}
.fh .about-right p{max-width: 100%; margin-bottom: 30px;}
.fh .services{padding: var(--py) var(--px); display: grid; grid-template-columns: 1fr; gap: 40px;}
.fh .service-card .card-number{font-size: 42px; font-family: "Monoton", cursive; color: var(--saffron);}
.fh .service-card .card-heading{color: var(--space-cadet); font-size: var(--fs-3); font-weight: 600; letter-spacing: -1px; margin-bottom: 20px;}
.fh .service-card .card-text{color: var(--rhythm); font-size: var(--fs-4); line-height: 1.5;}
.fh .product{padding: var(--py) var(--px);}
.fh .product .section-title{margin-bottom: 30px;}
.fh .product .section-text{margin-bottom: 60px;}
.fh .products-grid{display: grid; grid-template-columns: 1fr; gap: 40px; margin-bottom: 50px;}
.fh .product-card .img-box{position: relative; overflow: hidden;}
.fh .product-img{width: 100%; height: 100%; object-fit: cover; transition: var(--default-transition);}
.fh .product-card:hover .product-img{transform: scale(1.05);}
.fh .card-badge{position: absolute; top: 15px; left: 15px; display: flex; align-items: center; gap: 5px; padding: 5px 8px; font-size: 14px;}
.fh .card-badge ion-icon{font-size: 13px;}
.fh .card-badge.green{background: var(--pistachio); color: var(--space-cadet);}
.fh .card-badge.red{background: var(--red-orange-crayola); color: var(--space-cadet);}
.fh .product-card .wrapper{display: flex; justify-content: space-between; align-items: center; gap: 15px; background: var(--cultured); margin-bottom: 15px;}
.fh .product-card .product-name{color: var(--space-cadet); font-size: var(--fs-3); font-weight: 600; padding-left: 15px;}
.fh .product-card .product-price{background: var(--saffron); height: 60px; width: 60px; display: flex; justify-content: center; align-items: center; color: var(--space-cadet); font-size: 24px; font-weight: 500;}
.fh .product-card .small{font-size: 12px; font-weight: 400; margin-top: 5px;}
.fh .product-card .product-text{font-size: var(--fs-4); color: var(--rhythm); line-height: 1.6; letter-spacing: 0.4px; margin-bottom: 15px;}
.fh .product-card .product-rating{display: flex; align-items: center; gap: 5px; color: var(--saffron);}
.fh .product .btn-primary{margin-inline: auto;}
.fh .testimonials{padding: var(--py) var(--px) 120px;}
.fh .testimonials .section-title{margin-bottom: 15px;}
.fh .testimonials .section-text{margin-bottom: 50px;}
.fh .testimonials-grid{display: grid; grid-template-columns: 1fr; gap: 50px;}
.fh .testimonials-card .card-title{color: var(--space-cadet); font-weight: 600; margin-bottom: 15px;}
.fh .testimonials-rating{display: flex; align-items: center; gap: 5px; margin-bottom: 15px;}
.fh .testimonials-rating ion-icon{color: var(--saffron);}
.fh .testimonials-text{font-size: var(--fs-4); color: var(--rhythm); line-height: 1.4; letter-spacing: 0.5px; margin-bottom: 15px;}
.fh .customer-info{display: flex; align-items: center; gap: 15px;}
.fh .customer-img-box{width: 50px; height: 50px; border-radius: 50%; overflow: hidden;}
.fh .customer-img{width: 100%; height: 100%; object-fit: cover;}
.fh .customer-name{font-size: 14px; color: var(--space-cadet); font-weight: 600;}
.fh footer{background: var(--space-cadet); padding: 50px var(--px);}
.fh .footer-wrapper{display: flex; flex-direction: column; align-items: center; gap: 30px;}
.fh .social-link{display: flex; gap: 15px;}
.fh .social-link ion-icon{color: var(--cultured); font-size: 15px; transition: 0.25s ease;}
.fh .social-link ion-icon:hover{color: var(--saffron);}
.fh .copyright{font-size: 12px; color: var(--rhythm); text-align: center; letter-spacing: 0.5px;}
@media (min-width: 450px){.fh{--fs-1: 54px; --fs-2: 36px; --fs-3: 20px;}
.fh .home-text{max-width: 320px; margin-inline: auto;}
.fh .home .btn-group{flex-direction: row; justify-content: center;}
.fh .dialog-1{top: 15%;}
.fh .dialog-2{right: 15%;}

window.fbLogin=(e,p)=>signInWithEmailAndPassword(auth,e,p);
window.fbOut=()=>signOut(auth);
window.fbSave=async(s,pend,del)=>{for(const [id,d] of Object.entries(pend))await setDoc(doc(db,"images",id),{d});await setDoc(ref,{json:JSON.stringify(s)});await setDoc(doc(db,"site","status"),{on:s.settings.payOn===true});for(const id of del){try{await deleteDoc(doc(db,"images",id))}catch(e){}}};
window.fbOrder=o=>setDoc(doc(db,"orders",o.no),o);
window.fbLoadOrders=async()=>{const q=await getDocs(query(collection(db,"orders"),orderBy("at","desc"),limit(30)));return q.docs.map(d=>d.data())};
window.fbOrderSet=async(no,p)=>{await updateDoc(doc(db,"orders",no),p);await setDoc(doc(db,"st",no),{s:p.status,at:Date.now()})};
window.fbEvent=o=>setDoc(doc(db,"events",o.id),o);window.fbLoadEvents=async()=>{const q=await getDocs(query(collection(db,"events"),orderBy("at","desc"),limit(50)));return q.docs.map(d=>d.data())};window.fbEventSet=(id,p)=>updateDoc(doc(db,"events",id),p);window.fbEventDel=id=>deleteDoc(doc(db,"events",id));
window.fbStatus=async no=>{const d=await getDoc(doc(db,"st",no));return d.exists()?d.data().s:"pending"};
window.fbOrderDel=async no=>{await deleteDoc(doc(db,"orders",no));try{await deleteDoc(doc(db,"st",no))}catch(e){}};
onAuthStateChanged(auth,u=>window.setAdmin(!!u));
try{const d=await getDoc(ref);if(d.exists())window.setS(JSON.parse(d.data().json))}catch(e){console.warn(e)}
try{const q=await getDocs(collection(db,"images"));const m={};q.forEach(x=>{m[x.id]=x.data().d});window.setImgs(m)}catch(e){console.warn(e)}
}
</script>
</body>
</html>
