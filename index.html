<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Street Caffeine</title>
<style>
:root{--bg:#14110f;--acc:#ffb300;--fg:#f5efe6;--mut:#b8a99a;--on:#1a1200;--card:color-mix(in srgb,var(--bg) 90%,var(--fg));--line:color-mix(in srgb,var(--bg) 82%,var(--fg));--wa:#25d366;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:"Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
.w{max-width:960px;margin:0 auto;padding:0 14px}
.hero{color:#fff;text-align:center;padding:54px 16px 38px;background:radial-gradient(120% 110% at 50% 0,color-mix(in srgb,var(--acc) 55%,#000),var(--bg));background-size:cover;background-position:center;border-radius:0 0 28px 28px}
.logo{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--acc);margin-bottom:10px;box-shadow:0 8px 28px #0009;background:#000}
h1{font-family:Impact,"Arial Narrow Bold",sans-serif;font-size:clamp(40px,12vw,72px);line-height:1;margin:0;text-transform:uppercase;letter-spacing:.03em;text-shadow:0 3px 18px #0008}
.tag{margin:8px 0 14px;font-size:17px;opacity:.92}.bd{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.pill{display:inline-block;padding:6px 14px;border-radius:99px;font-size:13.5px;font-weight:700}.gl{background:#ffffff26;color:#fff;backdrop-filter:blur(6px)}
.open{background:#1c8c4a;color:#fff}.closed{background:#b3362f;color:#fff}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.wab{background:var(--wa);color:#04210f}
.banner{background:var(--acc);color:var(--on);padding:11px 16px;text-align:center;font-weight:800;margin-top:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;position:sticky;top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);z-index:5;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 16px;border-radius:99px;font-size:14px;font-weight:600;text-decoration:none}
h2{font-size:22px;font-weight:800;margin:30px 0 12px;display:flex;align-items:center;gap:10px}h2:before{content:"";width:5px;height:22px;background:var(--acc);border-radius:3px}
h3{margin:0 0 4px;font-size:18px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.item{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 4px 14px #0003}
.em{position:relative;aspect-ratio:4/3;display:grid;place-items:center;font-size:52px;background:color-mix(in srgb,var(--acc) 16%,var(--card));overflow:hidden}.em img{width:100%;height:100%;object-fit:cover}
.inf{padding:10px 12px 0;flex:1;min-width:0}.inf b{display:block;font-size:15px}.inf small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.ft{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:10px 12px 12px}.pr{color:var(--acc);font-weight:800;font-size:16px}.so{color:#ff8f8f;font-size:12px;font-weight:700}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:99px;padding:9px 16px;background:var(--acc);color:var(--on);font-weight:800;text-decoration:none;display:inline-block}
button.g{background:color-mix(in srgb,var(--bg) 80%,var(--fg));color:var(--fg)}button.wa{background:var(--wa);color:#04210f;width:100%;padding:14px;font-size:16px;border-radius:14px}button.rm{background:#4a2020;color:#ffb3b3}
.qty{display:flex;align-items:center;gap:8px}.qty button{padding:3px 11px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:16px;padding:14px;margin-bottom:12px}.card p{margin:0;color:var(--mut);white-space:pre-wrap}
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;max-width:600px;margin:0 auto}.cartbar button{width:100%;padding:15px;font-size:16px;box-shadow:0 8px 28px #000a}
.ov{position:fixed;inset:0;background:#000b;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);color:var(--fg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.row{flex-wrap:wrap;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
input,select,textarea{width:100%;font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:4px 0}
label{font-size:13px;color:var(--mut)}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}.tabs button{background:var(--card);color:var(--fg)}.tabs button.on{background:var(--acc);color:var(--on)}
.adm{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:25}
footer{text-align:center;color:var(--mut);padding:34px 16px 110px;font-size:14px;line-height:1.8}footer a{color:var(--acc);font-weight:700}footer .logo{width:56px;height:56px}
.ed{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.bdg{position:absolute;top:8px;left:8px;background:var(--acc);color:var(--on);font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;font-family:system-ui,sans-serif}.bdg.nw{background:#2aa6ff;color:#fff}
.warn{background:#4a1f1f;border:1px solid #b3362f;color:#ffd0cc;padding:10px 12px;border-radius:12px;font-weight:700;margin:10px 0;font-size:14px}
.soc{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 20px}
.sb{display:inline-flex;align-items:center;gap:8px;padding:14px 22px;border-radius:16px;font-size:17px;font-weight:800;color:#fff;text-decoration:none;box-shadow:0 4px 14px #0006;transition:transform .15s,box-shadow .15s,filter .15s}
.sb:hover,.sb:focus-visible{transform:translateY(-4px) scale(1.05);box-shadow:0 12px 28px #000a;filter:brightness(1.15)}
.sb:active{transform:scale(.97)}
.sb.ig{background:linear-gradient(45deg,#f09433,#dc2743 55%,#bc1888)}.sb.tt{background:#000;border:2px solid #fff3}.sb.fb{background:#1877f2}.sb.rt{background:#ffc107;color:#1a1200}
.btn,button.wa{transition:transform .15s,filter .15s}.btn:hover,button.wa:hover{transform:translateY(-2px);filter:brightness(1.1)}
button:disabled{opacity:.45;cursor:not-allowed}button:disabled:hover{transform:none;filter:none}
.pause{background:#b3362f;color:#fff;padding:14px 16px;text-align:center;font-weight:800;font-size:16px;line-height:1.5}
.pause .btn{margin-top:10px;background:var(--wa);color:#04210f;padding:14px 26px;font-size:17px;border-radius:14px}
.tg{width:100%;padding:16px;font-size:17px;border-radius:14px;margin:8px 0 4px;color:#fff;line-height:1.3}.tg.on{background:#1c8c4a}.tg.off{background:#b3362f}.tg small{display:block;font-weight:600;opacity:.9;font-size:13px}
.bigwa{font-size:18px!important;padding:18px!important}
</style>
</head>
<body>
<div id="app"></div>
<script id="data" type="application/json">{"settings":{"name":"Street Caffeine","tagline":"Coffee. Toast. Good vibes.","wa":"60148592647","address":"Jln. UP 1/3, Ukay Perdana, 68000 Ampang, Selangor","hours":"Every day 7pm – 1am · Closed Wednesday","instagram":"","tiktok":"","facebook":"","map":"https://www.google.com/maps/search/?api=1&query=Street+Caffeine+Ukay+Perdana+Ampang"},"banner":"Welcome to Street Caffeine! Order on WhatsApp and pay in chat.","offers":[],"posts":[],"cats":["Coffee","Drinks","Drumstick Combo","Snack Time"],"items":[{"id":1,"cat":"Coffee","name":"Espresso","price":6,"emoji":"☕","desc":"Short, strong, bold"},{"id":2,"cat":"Coffee","name":"Americano","price":7,"emoji":"☕","desc":"Hot or iced"},{"id":3,"cat":"Coffee","name":"Latte","price":10,"emoji":"🥛","desc":"Smooth espresso with steamed milk"},{"id":4,"cat":"Coffee","name":"Cappuccino","price":10,"emoji":"☕","desc":"Foamy and rich"},{"id":5,"cat":"Drinks","name":"Chocolate","price":11,"emoji":"🍫","desc":"Thick, creamy chocolate"},{"id":6,"cat":"Drinks","name":"Mojito","price":10,"emoji":"🍃","desc":"Fresh mint and lime"},{"id":7,"cat":"Drinks","name":"Soda","price":8,"emoji":"🥤","desc":"Fizzy and cold"},{"id":8,"cat":"Drumstick Combo","name":"Spicy Drumstick Combo","price":16,"emoji":"🍗","desc":"Crispy, juicy, spicy"},{"id":9,"cat":"Drumstick Combo","name":"Cheese Drumstick Combo","price":17,"emoji":"🍗","desc":"Crispy chicken with cheese"},{"id":10,"cat":"Drumstick Combo","name":"Korean Drumstick Combo","price":18,"emoji":"🍗","desc":"Sweet and sticky Korean glaze"},{"id":11,"cat":"Snack Time","name":"Classic Toast","price":3.5,"emoji":"🍞","desc":"Simple and golden"},{"id":12,"cat":"Snack Time","name":"Golden Kaya Toast","price":3.5,"emoji":"🍞","desc":"Kaya and butter"},{"id":13,"cat":"Snack Time","name":"Choco Toast","price":4,"emoji":"🍫","desc":"Warm chocolate spread"},{"id":14,"cat":"Snack Time","name":"Nutty Toast","price":4.5,"emoji":"🥜","desc":"Peanut crunch"},{"id":15,"cat":"Snack Time","name":"Mix Toast","price":5,"emoji":"🍞","desc":"A bit of everything"}]}</script>
<script>
const CUR="RM";
let S=JSON.parse(document.getElementById("data").textContent);
let IMGS={},PEND={},DEL=[];let cart={},cartOpen=false,admin=false,tab="menu",isAdmin=false,loginOpen=false,loginErr="",form={name:"",mode:"Pickup",addr:"",note:""};
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>(S.settings.cur||CUR)+" "+(Math.round(n*100)/100).toFixed(2).replace(/\.00$/,"");
function isOpen(){const s=S.settings,o=+(s.open??19),c=+(s.close??1),off=s.off===undefined?3:+s.off;const d=new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Kuala_Lumpur"}));const h=d.getHours(),w=d.getDay();if(o>c)return (h>=o&&w!==off)||(h<c&&(w+6)%7!==off);return h>=o&&h<c&&w!==off}
function sub(){return S.items.reduce((s,i)=>s+(cart[i.id]||0)*i.price,0)}
function fee(){return form.mode==="Delivery"?(+S.settings.fee||0):0}
function total(){return sub()+fee()}
function toggleHtml(){const on=!paused();return `<button class="tg ${on?"on":"off"}" onclick="toggleOnline()">${on?"🟢 Online orders: ON":"🔴 Online orders: OFF"}<small>${on?"Customers can order and pay on the website. Tap to turn OFF.":"Customers see the WhatsApp order button. Tap to turn ON."}</small></button>`}
async function toggleOnline(){const v=paused();S.settings.payOn=v;try{await window.fbSave(S,PEND,DEL);PEND={};DEL=[];render()}catch(e){S.settings.payOn=!v;alert("Failed: "+(e.message||e));render()}}
function paused(){return S.settings.payOn!==true}
function waNum(){return (S.settings.wa||"").replace(/\D/g,"")}
function pauseHtml(){return `<div class="pause">⚠️ We are not taking online orders for a while.<br>You can still order through WhatsApp.<br><button class="btn" onclick="if(count()){cartOpen=true;render()}else{window.open('https://wa.me/${waNum()}','_blank')}">💬 Order on WhatsApp</button></div>`}
function socHtml(){const s=S.settings,L=[["instagram","ig","📸 Instagram"],["tiktok","tt","🎵 TikTok"],["facebook","fb","👍 Facebook"],["review","rt","⭐ Rate us"]];return `<div class="soc">${L.map(x=>s[x[0]]?`<a class="sb ${x[1]}" target="_blank" rel="noopener" href="${esc(s[x[0]])}">${x[2]}</a>`:`<a class="sb ${x[1]}" href="#" onclick="alert('Coming soon!');return false">${x[2]}</a>`).join("")}</div>`}
function orderWA(){syncForm();if(!form.name.trim()){alert("Please enter your name");return}if(form.mode==="Delivery"&&!form.addr.trim()){alert("Please enter your delivery address");return}if(S.settings.minOrder&&sub()<+S.settings.minOrder){alert("Minimum order is "+money(+S.settings.minOrder));return}let m=`Hi ${S.settings.name}! I would like to place an order:\n`;S.items.filter(i=>cart[i.id]).forEach(i=>{m+=`• ${cart[i.id]} x ${i.name} - ${money(cart[i.id]*i.price)}\n`});m+=(fee()?`\nDelivery fee: ${money(fee())}`:"")+`\nTotal: ${money(total())}\nName: ${form.name.trim()}\n${form.mode}`+(form.mode==="Delivery"?`: ${form.addr.trim()}`:"")+(form.note.trim()?`\nNote: ${form.note.trim()}`:"")+`\n\nI will pay in the WhatsApp chat.`;window.open("https://wa.me/"+waNum()+"?text="+encodeURIComponent(m),"_blank")}
function count(){return Object.values(cart).reduce((a,b)=>a+b,0)}
function theme(){const s=S.settings,r=document.documentElement.style,ac=s.accent||"#ffb300",bg=s.bg||"#14110f";const L=x=>{const n=parseInt(x.slice(1),16);return ((n>>16)*299+((n>>8)&255)*587+(n&255)*114)/1000};const dk=L(bg)<140;r.setProperty("--acc",ac);r.setProperty("--bg",bg);r.setProperty("--fg",dk?"#f5efe6":"#1b1511");r.setProperty("--mut",dk?"#b8a99a":"#6d5f53");r.setProperty("--on",L(ac)<150?"#fff":"#1a1200");r.setProperty("color-scheme",dk?"dark":"light")}
function render(){
syncForm();
theme();
const sc0=(document.querySelector(".sheet")||{}).scrollTop||0;const offs=S.offers.filter(x=>x.on!==false);
const st=S.settings,o=isOpen();document.title=st.name||"Street Caffeine";
let h=`<div class="hero" style="${st.hero&&IMGS[st.hero]?`background-image:linear-gradient(#000a,#0006 60%,var(--bg)),url('${IMGS[st.hero]}')`:""}">${socHtml()}${st.logo&&IMGS[st.logo]?`<img class="logo" src="${IMGS[st.logo]}" alt="">`:""}<h1>${esc(st.name)}</h1><p class="tag">${esc(st.tagline)}</p><div class="bd">${st.showStatus!==false?`<span class="pill ${o?"open":"closed"}">${o?"Open now":"Closed now"}</span>`:""}<span class="pill gl">${esc(st.hours)}</span></div><div class="cta"><a class="btn" href="#c-0">View menu</a><a class="btn wab" target="_blank" rel="noopener" href="https://wa.me/${esc((st.wa||"").replace(/\D/g,""))}">Chat on WhatsApp</a></div></div>`;
if(S.banner)h+=`<div class="banner">${esc(S.banner)}</div>`;
h+=`<div class="chips">${S.cats.map(c=>`<a class="chip" href="#c-${S.cats.indexOf(c)}">${esc(c)}</a>`).join("")}${offs.length?`<a class="chip" href="#offers">Offers</a>`:""}${S.posts.length?`<a class="chip" href="#posts">Recipes & News</a>`:""}</div><div class="w"><input id="sq" type="search" placeholder="🔍 Search menu" value="${esc(sqv)}" oninput="sqv=this.value;srch()" style="margin-top:6px;border-radius:99px;padding:11px 16px">`;
if(offs.length)h+=`<h2 id="offers">Offers</h2>`+offs.map(x=>`<div class="card">${x.img&&IMGS[x.img]?`<img src="${IMGS[x.img]}" style="width:100%;max-height:240px;object-fit:cover;border-radius:10px;margin-bottom:8px">`:""}<h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></div>`).join("");
S.cats.forEach((c,ci)=>{const its=S.items.filter(i=>i.cat===c);if(!its.length)return;
h+=`<h2 id="c-${ci}">${esc(c)}</h2><div class="grid">`+its.map(i=>{const q=cart[i.id]||0;
return `<div class="item" data-s="${esc((i.name+" "+i.desc).toLowerCase())}"><div class="em">${i.img&&IMGS[i.img]?`<img src="${IMGS[i.img]}" style="width:100%;height:100%;object-fit:cover">`:esc(i.emoji||"☕")}${i.hot?`<span class="bdg">🔥 Popular</span>`:i.nw?`<span class="bdg nw">✨ New</span>`:""}</div><div class="inf"><b>${esc(i.name)}</b><small>${esc(i.desc)}</small></div><div class="ft"><span class="pr">${money(i.price)}</span>`+
(i.sold?`<span class="so">Sold out</span>`:q?`<div class="qty"><button class="g" onclick="chg(${i.id},-1)">−</button><b>${q}</b><button onclick="chg(${i.id},1)">+</button></div>`:`<button onclick="chg(${i.id},1)">Add</button>`)+`</div></div>`}).join("")+`</div>`});
if(S.posts.length)h+=`<h2 id="posts">Recipes & News</h2>`+S.posts.map(x=>`<div class="card">${x.img&&IMGS[x.img]?`<img src="${IMGS[x.img]}" style="width:100%;max-height:240px;object-fit:cover;border-radius:10px;margin-bottom:8px">`:""}<h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></div>`).join("");
h+=`${st.about?`<h2>About us</h2><div class="card"><p>${esc(st.about)}</p></div>`:""}</div><footer>${st.logo&&IMGS[st.logo]?`<img class="logo" src="${IMGS[st.logo]}" alt=""><br>`:""}<b style="color:var(--fg);font-size:17px">${esc(st.name)}</b><br>${esc(st.address)}<br>${esc(st.hours)}<br><a href="${esc(st.map)}" target="_blank" rel="noopener">Get directions</a> · <a href="https://wa.me/${esc((st.wa||"").replace(/\D/g,""))}" target="_blank" rel="noopener">WhatsApp</a>${st.review?` · <a href="${esc(st.review)}" target="_blank" rel="noopener">⭐ Rate us</a>`:""}<br>`+["instagram","tiktok","facebook"].filter(k=>st[k]).map(k=>`<a href="${esc(st[k])}" target="_blank" rel="noopener">${k[0].toUpperCase()+k.slice(1)}</a>`).join(" · ")+`</footer>`;
if(count())h+=`<div class="cartbar"><button onclick="cartOpen=true;render()">View order · ${count()} items · ${money(total())}</button></div>`;
h+=`<div class="adm">${isAdmin?`<button onclick="admin=true;render()">Admin</button>`:`<button class="g" onclick="loginOpen=true;render()">Staff</button>`}</div>`;
if(cartOpen)h+=cartHtml();
if(admin)h+=adminHtml();
if(loginOpen&&!isAdmin)h+=loginHtml();
$("#app").innerHTML=h;const sc1=document.querySelector(".sheet");if(sc1)sc1.scrollTop=sc0;srch()}
function chg(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];if(!count())cartOpen=false;render()}
let sqv="",step="form",rcpt="",busy=false,last=null,ORD=null;
function waLink(o){let m=`Hi ${S.settings.name}! New PAID order #${o.no}\n`;o.items.forEach(i=>{m+=`• ${i.q} x ${i.n} - ${money(i.q*i.p)}\n`});m+=(o.fee?`\nDelivery fee: ${money(o.fee)}`:"")+`\nTotal: ${money(o.total)}\nName: ${o.name}\n${o.mode}`+(o.mode==="Delivery"?`: ${o.addr}`:"")+(o.note?`\nNote: ${o.note}`:"")+`\n\nPayment receipt uploaded on the website (order #${o.no}).`;return "https://wa.me/"+(S.settings.wa||"").replace(/\D/g,"")+"?text="+encodeURIComponent(m)}
function cartHtml(){
if(step==="done")return `<div class="ov"><div class="sheet"><h2 style="margin-top:0">Order received ✅</h2><p>Your order number is <b>#${esc(last.no)}</b>. We will check your payment and confirm shortly.</p>${S.settings.prep?`<p>⏱ ${esc(S.settings.prep)}</p>`:""}<button class="g" style="width:100%;margin-bottom:8px" onclick="chkSt()">Check order status</button><p id="stt" style="font-weight:700"></p><p style="color:var(--mut);font-size:13px">Tap below to also send your order details to us on WhatsApp (then tap Send in WhatsApp).</p><a class="btn" style="display:block;text-align:center;background:var(--wa);color:#04210f;padding:14px;border-radius:14px" target="_blank" rel="noopener" href="${waLink(last)}">Send on WhatsApp</a><button class="g" style="width:100%;margin-top:8px" onclick="closeCart()">Done</button></div></div>`;
if(step==="pay"&&paused())step="form";if(step==="pay")return `<div class="ov"><div class="sheet"><h2 style="margin-top:0">Pay now</h2><div class="row"><b>Total to pay</b><b>${money(total())}</b></div><div class="warn">⚠️ Your order is NOT confirmed until you upload your payment receipt. Pay first, then upload the screenshot and tap Submit.</div>${S.settings.qr&&IMGS[S.settings.qr]?`<img src="${IMGS[S.settings.qr]}" style="width:100%;max-width:300px;display:block;margin:12px auto;border-radius:14px;background:#fff">`:`<p style="color:#ff8f8f">Payment QR is not set up yet. Please contact us.</p>`}<p style="color:var(--mut);font-size:13px">${esc(S.settings.payNote||"Scan the QR with your banking app, pay the exact total, then upload your receipt screenshot.")}</p><label>Upload payment receipt (screenshot)</label><input type="file" accept="image/*" onchange="getRcpt(this)">${rcpt?`<img src="${rcpt}" style="height:90px;border-radius:10px;margin:6px 0">`:""}<button class="wa" ${busy||!rcpt?"disabled":""} onclick="submitOrder()">${busy?"Sending...":rcpt?"Submit order":"Upload receipt to submit"}</button><button class="g" style="width:100%;margin-top:8px" onclick="step='form';render()">Back</button></div></div>`;
const rows=S.items.filter(i=>cart[i.id]).map(i=>`<div class="row"><span>${cart[i.id]} × ${esc(i.name)}</span><span>${money(cart[i.id]*i.price)}</span></div>`).join("");
return `<div class="ov" onclick="if(event.target===this){cartOpen=false;render()}"><div class="sheet"><h2 style="margin-top:0">Your order</h2>${paused()?`<div class="warn">⚠️ We have temporarily stopped taking orders online. Online ordering is temporarily stopped. Please send your order on WhatsApp instead.</div>`:""}${rows}${fee()?`<div class="row"><span>Delivery fee</span><span>${money(fee())}</span></div>`:""}<div class="row"><b>Total</b><b>${money(total())}</b></div>${isOpen()?"":`<p style="color:#ffb3b3;font-size:13px">We are closed right now. You can still order and we will prepare it when we open.</p>`}

function compress(f,max,png){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL(png?"image/png":"image/jpeg",.72))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}
